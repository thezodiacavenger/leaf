name: Bug report
description: Leaf did the wrong thing (or nothing) with a file
labels: [bug]
body:
  - type: textarea
    id: dropped
    attributes:
      label: What did you drop?
      description: File type(s), roughly how many, and size. e.g. "a zip of 40 HEIC photos, 210 MB"
    validations: { required: true }
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Leaf version, placeholder: "0.3.0" }
    validations: { required: true }
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11 (22H2 or later), Windows 11 (21H2), Windows 10, Other]
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Error log (optional)
      description: Paste the last lines of %APPDATA%\Leaf\leaf.log. Don't attach private files; describe them instead.
      render: text
