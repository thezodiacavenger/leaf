name: Release
# Bump "version" in package.json and push to main: if that version hasn't been released yet,
# this builds Leaf on Windows and publishes the portable .exe and installer on the Releases page.
# Tags (v*) and manual runs work too.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which version?
        id: v
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$v already released"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with: { node-version: 22, cache: npm }
      - if: steps.v.outputs.exists == 'false'
        run: npm ci
      - name: Build portable .exe and installer
        if: steps.v.outputs.exists == 'false'
        shell: bash
        run: npx electron-builder --win portable nsis --x64 --publish never --config.win.signAndEditExecutable=true
      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/*.exe --target "$GITHUB_SHA" --title "Leaf ${{ steps.v.outputs.tag }}" \
            --notes "Download **Leaf-Setup** to install (Start menu, uninstaller) or **portable** to run without installing. Windows 10/11, 64-bit. Builds are unsigned: on first run choose *More info → Run anyway*. See the [README](https://github.com/thezodiacavenger/leaf#readme) for what's new."
