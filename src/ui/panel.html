<!doctype html>
<html><head><meta charset="utf-8"><title>Leaf</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' leaf:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  body { padding: 14px; }
  body.sys { padding: 0; }
  .card { background: var(--glass); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; overflow: hidden; position: relative; }
  body.sys .card { background: none; border: 0; box-shadow: none; border-radius: 0; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }
  .view { animation: in .32s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .head { display: flex; gap: 12px; align-items: center; }
  .tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--hover); border: 1px solid var(--line); flex: none; }
  .tile svg { width: 20px; height: 20px; }
  h1 { font: 600 15px/1.25 var(--font-display); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--ink-3); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { min-width: 0; flex: 1; }
  .x { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); align-self: flex-start; }
  .x:hover { background: var(--hover); color: var(--ink); }
  .primary { margin-top: 16px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13.5px; text-align: left;
    box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .2s var(--spring), filter .2s; position: relative; overflow: hidden; }
  .primary::after { content: ""; position: absolute; inset: 0; background: var(--aura); opacity: 0; transition: opacity .3s; mix-blend-mode: soft-light; }
  .primary:hover { filter: brightness(1.06); } .primary:hover::after { opacity: .7; }
  .primary:active { transform: scale(.985); }
  .primary .lbl { flex: 1; } .primary small { display: block; font-weight: 400; opacity: .78; font-size: 11.5px; }
  .primary kbd { border-color: rgba(255,255,255,.6); opacity: .8; }
  .alts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .alt { display: inline-flex; gap: 7px; align-items: center; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; transition: background .15s, color .15s; }
  .alt:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .alt:disabled { opacity: .5; }
  .alt kbd { font-size: 9.5px; padding: 2px 4px; }
  .foot { display: flex; justify-content: space-between; margin-top: 14px; color: var(--ink-3); font-size: 11.5px; }
  /* progress */
  .track { height: 4px; border-radius: 4px; background: var(--hover); margin-top: 18px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 4px; background: var(--aura); background-size: 200% 100%; animation: flow 1.6s linear infinite; transition: width .25s var(--ease); }
  @keyframes flow { to { background-position: -200% 0; } }
  .now { margin-top: 8px; display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11.5px; gap: 12px; }
  .now span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* done */
  .fan { display: flex; margin-top: 16px; height: 86px; cursor: pointer; padding-left: 6px; }
  .fan img { width: 86px; height: 86px; object-fit: cover; border-radius: 12px; border: 2px solid var(--glass); box-shadow: 0 6px 16px -6px rgba(0,0,0,.35); margin-left: -34px; transition: transform .35s var(--spring); background: var(--hover); }
  .fan img:first-child { margin-left: 0; }
  .fan:hover img { transform: translateX(calc(var(--i) * 8px)) rotate(calc((var(--i) - 2) * 2deg)); }
  .fan .more { align-self: center; margin-left: 14px; color: var(--ink-3); font-size: 12px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 6px 9px; border-radius: 12px; border: 1px solid var(--line); color: var(--ink-2); font-size: 12px; transition: background .15s, color .15s, transform .2s var(--spring); }
  .act:hover { background: var(--hover); color: var(--ink); } .act:active { transform: scale(.97); }
  .act.main { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .note { margin-top: 10px; font-size: 11.5px; color: var(--ink-3); }
  .note b { color: var(--warn); font-weight: 600; }
  details summary { cursor: pointer; } details ul { margin: 6px 0 0; padding-left: 16px; max-height: 90px; overflow: auto; }
  .ok { color: var(--ok); }
  .recent { margin-top: 14px; display: grid; gap: 2px; }
  .recent button { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 9px; text-align: left; color: var(--ink-2); }
  .recent button:hover { background: var(--hover); color: var(--ink); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-top: 16px; }
  .hero { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .hero span { font: 600 13px/1 var(--font-display); padding: 8px 10px; border-radius: 9px; background: var(--hover); border: 1px solid var(--line); letter-spacing: -.01em; }
  .kv { display: grid; grid-template-columns: 104px 1fr; gap: 7px 12px; margin-top: 14px; font-size: 12.5px; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .tools { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .tool { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; }
  .tool:hover { background: var(--hover); color: var(--ink); } .tool svg { width: 15px; height: 15px; }
  .pager { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; }
  .pager button { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--ink-2); }
  .pager button:hover { background: var(--hover); color: var(--ink); } .pager svg { width: 14px; height: 14px; }
  .skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--hover), var(--press), var(--hover)); background-size: 200% 100%; animation: flow 1.2s linear infinite; margin-top: 12px; }
  .all { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .all input { width: 100%; font: inherit; color: inherit; background: var(--hover); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; outline: none; }
  .all input:focus { border-color: var(--accent); }
  .all .scroll { max-height: 330px; overflow: auto; margin-top: 8px; font-size: 11.5px; scrollbar-width: thin; -webkit-user-select: text; user-select: text; }
  .all .g { color: var(--accent); font-weight: 600; margin: 8px 0 3px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
  .all .t { display: grid; grid-template-columns: 44% 1fr; gap: 8px; padding: 2px 0; } .all .t span:first-child { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
  .all .t span:last-child { overflow-wrap: anywhere; }
.alt.more { color: var(--ink-3); border-style: dashed; }
  .ask { margin-top: 16px; } .ask label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .ask .field { display: flex; gap: 6px; }
  .ask input { flex: 1; font: inherit; font-size: 14px; color: inherit; background: var(--hover); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; outline: none; -webkit-user-select: text; user-select: text; }
  .ask input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .ask .peek { width: 40px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-3); display: grid; place-items: center; }
  .ask .note { margin-top: 8px; }
  .ask .err { color: #e5484d; font-size: 12px; margin-top: 6px; min-height: 1em; }
.offer { display: flex; gap: 12px; margin-top: 16px; padding: 12px; border-radius: 12px; background: var(--hover); border: 1px solid var(--line); }
  .offer img { width: 44px; height: 44px; flex: none; } .offer b { font-weight: 600; } .offer p { color: var(--ink-3); font-size: 12px; margin-top: 3px; }
  .offer .tools { margin-top: 10px; } .tool.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  body.over .card { outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: -8px; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="photo" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></symbol>
  <symbol id="doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></symbol>
  <symbol id="stack" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="sheet" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9.5h16M4 14.5h16M10 4v16"/></symbol>
  <symbol id="slides" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="camera" viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.5-2h6l1.5 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></symbol>
  <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14z"/><path d="M5 19L14 10"/></symbol>
</svg>
<div class="card" id="card"><div id="view"></div></div>
<script>
  if (new URLSearchParams(location.search).get('glass') === 'system') document.body.classList.add('sys');
  const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const icon = (id, cls = 'i') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
  const view = document.getElementById('view');
  let S = {}; let lastKey = '';

  new ResizeObserver(() => leaf.send('panel:height', Math.ceil(document.getElementById('card').getBoundingClientRect().height + (document.body.classList.contains('sys') ? 0 : 28)))).observe(document.getElementById('card'));

  const header = (ic, title, sub) => `<div class="head"><div class="tile">${icon(ic)}</div><div class="meta"><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div><button class="x" data-do="cancel" title="Dismiss (Esc)">${icon('close')}</button></div>`;

  function doneTitle(r) {
    if (r.action === 'pdf') return 'PDF ready';
    if (r.action === 'unzip') return `${r.outputs.length} files unzipped`;
    if (r.action === 'zip') return 'Zip ready';
    if (r.action === 'doc-mail') return 'Opened in Outlook';
    const n = r.outputs.length; const T = {
      'mail-pdf': n === 1 ? 'Email saved as PDF' : `${n} emails saved as PDF`, 'mail-onepdf': 'One PDF of all emails', 'mail-attach': `${n} attachment${n === 1 ? '' : 's'} saved`,
      combine: 'Combined PDF ready', 'pdf-compress': n === 1 ? 'Compressed' : `${n} PDFs compressed`, 'pdf-split': `${n} pages saved`, 'pdf-extract': 'Pages extracted',
      'pdf-rotate': 'Rotated', 'pdf-flatten': 'Form flattened', 'pdf-protect': 'Password added', 'pdf-unlock': 'Password removed', 'pdf-word': 'Word document ready',
      'office-pdf': n === 1 ? 'PDF ready' : `${n} PDFs ready`, 'office-email': 'PDF attached in Outlook', 'xls-csv': `${n} CSV file${n === 1 ? '' : 's'} ready`, 'csv-xlsx': 'Opened safely in Excel',
      'csv-clean': 'CSV cleaned', clean: 'Hidden data removed', 'photo-report': 'Photo report ready', ocr: n === 1 ? 'Searchable PDF ready' : `${n} searchable PDFs`, 'tiff-pdf': 'PDF ready' };
    if (T[r.action]) return T[r.action];
    const ext = (r.outputs[0]?.name.split('.').pop() || '').toUpperCase().replace('JPG', 'JPEG');
    return `${r.outputs.length} ${ext}${r.outputs.length === 1 ? '' : 's'} ready`;
  }

  function render() {
    const key = S.phase + (S.phase === 'done' ? S.result?.title : '') + (S.proposal?.title || '') + (S.phase === 'exif' ? S.exif?.index : '');
    if (S.phase === 'exif' && key !== lastKey) { query = ''; hideAll = false; }
    if (key !== lastKey) { asking = null; showMore = false; }
    const fresh = key !== lastKey; lastKey = key;
    let h = '';
    if (S.phase === 'reading') h = header('leaf', 'Looking inside…', 'One moment');
    else if (S.phase === 'proposal') {
      const p = S.proposal; const [first, ...rest] = p.actions;
      if (asking && p.actions[asking.i]) {
        const a = p.actions[asking.i]; const pw = a.ask.kind === 'password';
        h = header(pw ? 'lock' : p.icon, a.label.replace(/…$/, ''), p.title) +
          `<form class="ask" id="askf"><label for="askv">${esc(a.ask.label)}</label><div class="field"><input id="askv" type="${pw ? 'password' : 'text'}" autocomplete="off" spellcheck="false" placeholder="${esc(a.ask.placeholder || '')}">${pw ? `<button type="button" class="peek" data-do="peek" title="Show">${icon('eye')}</button>` : ''}</div>` +
          `<div class="err" id="askerr"></div>${pw && a.id === 'pdf-protect' ? '<div class="note">Leaf doesn’t keep this password. Send it to the recipient separately — not in the same email.</div>' : ''}` +
          `<button class="primary" type="submit"><span class="lbl">${esc(a.ask.go)}</span><kbd>Enter</kbd></button></form>` +
          `<div class="foot"><span></span><span>Esc to go back</span></div>`;
      } else {
        const shown = showMore ? rest : rest.slice(0, 4); const hidden = rest.length - shown.length;
        h = header(p.icon, p.title, p.subtitle) +
          `<button class="primary" data-act="0" ${first.disabled ? 'disabled' : ''}><span class="lbl">${esc(first.label)}<small>${esc(first.hint || '')}</small></span><kbd>Enter</kbd></button>` +
          (rest.length ? `<div class="alts">${shown.map((a, i) => `<button class="alt" data-act="${i + 1}" ${a.disabled ? 'disabled' : ''} title="${esc(a.hint || '')}">${esc(a.label)} <kbd>${i + 2 <= 9 ? i + 2 : ''}</kbd></button>`).join('')}${hidden ? `<button class="alt more" data-do="more">More (${hidden}) <kbd>M</kbd></button>` : ''}</div>` : '') +
          `<div class="foot"><span>Originals are never changed</span><span>Esc to dismiss</span></div>`;
      }
    } else if (S.phase === 'working') {
      const p = S.progress || {}; const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
      h = header('leaf', `${S.action}…`, p.total ? `${p.done} of ${p.total}` : 'Starting') +
        `<div class="track"><div class="fill" style="width:${Math.max(3, pct)}%"></div></div><div class="now"><span>${esc(p.name || '')}</span><span>Esc to stop</span></div>`;
    } else if (S.phase === 'done') {
      const r = S.result; const imgs = r.outputs.filter((o) => o.thumb); const fails = r.failures || [];
      const big = r.outputs.reduce((a, o) => a + (o.bytes || 0), 0) > 20e6;
      h = header('check', r.cancelled ? 'Stopped' : doneTitle(r), [r.title, r.size].filter(Boolean).join(' · ')) +
        (imgs.length ? `<div class="fan" data-do="gallery" title="Preview (Space)">${imgs.slice(0, 5).map((o, i) => `<img style="--i:${i}" src="${leaf.url(o.thumb)}" alt="">`).join('')}${imgs.length > 5 ? `<span class="more">+${imgs.length - 5}</span>` : ''}</div>` : '') +
        `<div class="row">` +
          (imgs.length ? `<button class="act main" data-do="gallery">${icon('eye')}Preview</button>` : r.outputs.length === 1 ? `<button class="act main" data-do="open">${icon('eye')}Open</button>` : '') +
          `<button class="act" data-do="folder">${icon('folder')}Folder</button>` +
          (r.outputs.length && r.action !== 'doc-mail' ? `<button class="act" data-do="email">${icon('mail')}Email</button>` : '') +
        `</div>` +
        (big && imgs.length ? `<div class="note">Over 20 MB — Email sends <b>email-size copies</b> (2048px). Originals stay full size.</div>` : '') +
        (r.outputs[0]?.note ? `<div class="note">${esc(r.outputs[0].note)}</div>` : '') +
        (() => { const dev = r.outputs.filter((o) => o.how === 'developed').length, cam = r.outputs.filter((o) => o.how === 'camera').length;
          return dev || cam ? `<div class="note">${[dev && `${dev} developed from RAW at full resolution`, cam && `${cam} used the camera’s own full-size JPEG`].filter(Boolean).join(' · ')}. Camera, lens & date kept.</div>` : ''; })() +
        (fails.length ? `<details class="note"><summary><b>${fails.length} skipped</b> — see why</summary><ul>${fails.map((f) => `<li>${esc(f.name)}: ${esc(f.reason)}</li>`).join('')}</ul></details>` : '');
    } else if (S.phase === 'exif') {
      const x = S.exif || {}; const i = x.info;
      const pager = x.count > 1 ? `<span class="pager"><button data-do="exif-prev" title="Previous (←)">${icon('back')}</button>${x.index + 1} of ${x.count}<button data-do="exif-next" title="Next (→)">${icon('next')}</button></span>` : '';
      h = `<div class="head"><div class="tile">${icon('camera')}</div><div class="meta"><h1>${esc(i ? i.camera : x.name)}</h1><div class="sub">${esc(x.name)} ${pager}</div></div><button class="x" data-do="${x.back ? 'exif-back' : 'cancel'}" title="${x.back ? 'Back' : 'Close'} (Esc)">${icon('close')}</button></div>`;
      if (x.error) h += `<div class="note">${esc(x.error)}</div>`;
      else if (!i) h += '<div class="skel" style="width:70%"></div><div class="skel"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:60%"></div>';
      else {
        h += (i.hero.length ? `<div class="hero">${i.hero.map((v) => `<span>${esc(v)}</span>`).join('')}</div>` : '') +
          (x.all && !hideAll ? '' : `<dl class="kv">${i.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`) +
          `<div class="tools">${x.back ? `<button class="tool" data-do="exif-back">${icon('back')}Back</button>` : ''}<button class="tool" data-do="exif-copy">${icon('copy')}Copy</button>` +
          `<button class="tool" data-do="exif-all">${icon('list')}${x.all ? 'Hide tags' : 'All tags'}</button>${i.gps ? `<button class="tool" data-do="exif-map">${icon('pin')}Map</button>` : ''}</div>`;
        if (x.all && !hideAll) h += `<div class="all"><input id="q" placeholder="Search ${x.all.length} tags…" value="${esc(query)}"><div class="scroll" id="tags">${tagsHtml(x.all)}</div></div>`;
      }
    } else if (S.phase === 'error') {
      h = header('file', 'That didn’t work', S.error) + `<div class="foot"><span>Try another file</span><span>Esc to dismiss</span></div>`;
    } else {
      h = header('leaf', 'Drop anything on the leaf', 'Emails, PDFs, Office files, photos, RAW, zips') +
        (S.pileOffer ? `<div class="offer"><img src="leaf-pile.ico" alt=""><div><b>Add a “Leaf Pile” folder to your desktop?</b><p>Drop or save files into it — from Outlook, a scanner, a download — and Leaf picks them up.</p><div class="tools"><button class="tool main" data-do="pile-yes">Add folder</button><button class="tool" data-do="pile-no">No thanks</button></div></div></div>` : '') +
        (S.recent?.length ? `<div class="label">Recent</div><div class="recent">${S.recent.map((r, i) => `<button data-recent="${i}"><span>${esc(r.title)}</span><span class="sub">${r.count} files</span></button>`).join('')}</div>` : '') +
        `<div class="foot"><span>Right-click the tray icon for settings</span><span></span></div>`;
    }
    if (fresh) { view.className = ''; void view.offsetWidth; view.className = 'view'; view.innerHTML = h; }
    else view.innerHTML = h;
    if (fresh) (view.querySelector('.primary:not(:disabled), .act.main') || document.body).focus?.();
  }

  let query = ''; let hideAll = false; let asking = null; let showMore = false;
  // Picking an action that needs input (password, pages) opens a small inline form first.
  function choose(i) {
    const a = S.proposal?.actions?.[i]; if (!a || a.disabled) return;
    if (a.ask) { asking = { i }; render(); setTimeout(() => document.getElementById('askv')?.focus(), 30); return; }
    leaf.send('panel:act', i);
  }
  view.addEventListener('submit', (e) => {
    e.preventDefault(); const v = document.getElementById('askv').value; const a = S.proposal.actions[asking.i];
    const err = a.ask.kind === 'password' && a.id === 'pdf-protect' && v.length < 4 ? 'Use at least 4 characters' : a.ask.kind === 'pages' && !/\d/.test(v) ? 'Type page numbers, like 1-3, 7' : '';
    if (err) { document.getElementById('askerr').textContent = err; return; }
    const i = asking.i; asking = null; leaf.send('panel:act', i, v);
  });
  function tagsHtml(all) {
    const q = query.trim().toLowerCase(); let g = ''; let out = '';
    for (const [grp, name, v] of all) {
      if (q && !(name.toLowerCase().includes(q) || v.toLowerCase().includes(q) || grp.toLowerCase().includes(q))) continue;
      if (grp !== g) { g = grp; out += `<div class="g">${esc(grp)}</div>`; }
      out += `<div class="t"><span title="${esc(name)}">${esc(name.replace(/([a-z])([A-Z])/g, '$1 $2'))}</span><span>${esc(v.length > 300 ? v.slice(0, 300) + '…' : v)}</span></div>`;
    }
    return out || '<div class="note">No matching tags</div>';
  }
  view.addEventListener('input', (e) => { if (e.target.id === 'q') { query = e.target.value; document.getElementById('tags').innerHTML = tagsHtml(S.exif.all); } });

  async function doIt(what) {
    if (what === 'more') { showMore = !showMore; return render(); }
    if (what === 'pile-yes' || what === 'pile-no') return leaf.send('panel:pile', what === 'pile-yes');
    if (what === 'peek') { const f = document.getElementById('askv'); f.type = f.type === 'password' ? 'text' : 'password'; return f.focus(); }
    if (what.startsWith('exif-')) {
      if (what === 'exif-prev') leaf.send('panel:exif-step', -1);
      else if (what === 'exif-next') leaf.send('panel:exif-step', 1);
      else if (what === 'exif-all') { if (S.exif.all) { hideAll = !hideAll; render(); } else { hideAll = false; leaf.send('panel:exif-all'); } }
      else leaf.send('panel:' + what);
      if (what === 'exif-copy') { const b = view.querySelector('[data-do="exif-copy"]'); if (b) b.lastChild.textContent = 'Copied'; }
      return;
    }
    const r = S.result;
    if (what === 'cancel') leaf.send('panel:cancel');
    else if (what === 'gallery') leaf.send('panel:gallery');
    else if (what === 'folder') leaf.send('panel:folder');
    else if (what === 'open') leaf.send('panel:open', r.outputs[0].path);
    else if (what === 'email') {
      const files = r.outputs.map((o) => o.path);
      const shrink = r.outputs.reduce((a, o) => a + (o.bytes || 0), 0) > 20e6 && r.outputs.some((o) => o.thumb);
      leaf.send('panel:hide'); await leaf.invoke('email', files, { shrink });
    }
  }

  view.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]'); if (a) return choose(+a.dataset.act);
    const d = e.target.closest('[data-do]'); if (d) return doIt(d.dataset.do);
    const r = e.target.closest('[data-recent]'); if (r) leaf.send('panel:gallery', +r.dataset.recent);
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (asking) { asking = null; render(); return; } return leaf.send(S.phase === 'exif' && S.exif?.back ? 'panel:exif-back' : 'panel:cancel'); }
    if (S.phase === 'proposal') {
      if (asking) return;
      if (e.key === 'Enter' && !(document.activeElement instanceof HTMLButtonElement)) { e.preventDefault(); choose(0); }
      if (e.key.toLowerCase() === 'm') { showMore = !showMore; render(); }
      const n = +e.key; if (n >= 2 && n <= 9) choose(n - 1);
    } else if (S.phase === 'exif') {
      if (e.target.id === 'q') return;
      if (e.key === 'ArrowLeft') doIt('exif-prev'); else if (e.key === 'ArrowRight') doIt('exif-next');
      else if (e.key.toLowerCase() === 'c') doIt('exif-copy'); else if (e.key.toLowerCase() === 'a') doIt('exif-all');
    } else if (S.phase === 'done') {
      if (e.key === ' ' && !(document.activeElement instanceof HTMLButtonElement)) { e.preventDefault(); doIt('gallery'); }
      if (e.key.toLowerCase() === 'o') doIt('folder');
      if (e.key.toLowerCase() === 'e') doIt('email');
    }
  });
  // The panel is a drop target too.
  let depth = 0;
  addEventListener('dragenter', (e) => { e.preventDefault(); depth++; document.body.classList.add('over'); });
  addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('over'); } });
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', (e) => { e.preventDefault(); depth = 0; document.body.classList.remove('over'); leaf.send('leaf:drop', leaf.pathsOf([...e.dataTransfer.files])); });

  leaf.on('state', (s) => { S = s; render(); });
  leaf.send('ready');
</script>
</body></html>
