<!doctype html>
<html><head><meta charset="utf-8"><title>Leaf workroom</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:">
</head><body>
<script type="module">
// Hidden page that renders PDF pages to images (pdf.js) for text recognition.
import * as pdfjs from '../../node_modules/pdfjs-dist/legacy/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '../../node_modules/pdfjs-dist/legacy/build/pdf.worker.min.mjs';

workroom.onJob(async ({ id, method, bytes, dpi = 300 }) => {
  try {
    if (method !== 'renderPages') throw new Error('unknown job');
    const task = pdfjs.getDocument({ data: bytes, isEvalSupported: false, enableXfa: false }); const doc = await task.promise;
    const pages = [];
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const text = await page.getTextContent();
      const hasText = text.items.some((t) => t.str && t.str.trim());
      const rotation = page.rotate % 360;
      if (hasText || rotation !== 0) { pages.push({ n, skip: hasText ? 'has text' : 'rotated' }); page.cleanup(); continue; }
      const scale = Math.min(dpi / 72, 6000 / Math.max(page.view[2], page.view[3]));
      const vp = page.getViewport({ scale });
      const canvas = new OffscreenCanvas(Math.ceil(vp.width), Math.ceil(vp.height));
      const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const blob = await canvas.convertToBlob({ type: 'image/png' });
      // view = [x0, y0, x1, y1] of the page box; pixels map back to PDF points with scale and this origin.
      pages.push({ n, png: new Uint8Array(await blob.arrayBuffer()), width: canvas.width, height: canvas.height, scale, view: page.view });
      page.cleanup();
    }
    await task.destroy();
    workroom.done(id, { pages });
  } catch (e) { workroom.done(id, { error: String((e && e.message) || e) }); }
});
workroom.ready();
</script>
</body></html>
